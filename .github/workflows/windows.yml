name: Publish Studyroom Windows
on:
  push:
    branches: [toolbox-studyroom-windows-20261127]
permissions:
  contents: write
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build checked Windows distribution
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $runtime = 'electron-v45.5.0-win32-x64.zip'
          Invoke-WebRequest "https://github.com/electron/electron/releases/download/v45.5.0/$runtime" -OutFile runtime.zip
          if ((Get-FileHash runtime.zip).Hash -ne '20155c8b8aa5b1f575f3757bdf21490e0bac2f19a65a26ce9ba99bcf9f2c69bd') { throw 'Runtime checksum mismatch' }
          $bundle = 'Studyroom-Windows-x64'
          New-Item -ItemType Directory $bundle | Out-Null
          tar -xf runtime.zip -C $bundle
          if ($LASTEXITCODE) { throw 'Extraction failed' }
          Rename-Item -LiteralPath "$bundle/electron.exe" -NewName 'Studyroom.exe'
          Copy-Item app "$bundle/resources/app" -Recurse
          python set-icon.py "$bundle/Studyroom.exe" app/desktop/app.ico
          if ($LASTEXITCODE) { throw 'Logo embedding failed' }
          python check-package.py $bundle
          if ($LASTEXITCODE) { throw 'Application file mismatch' }
          tar -a -cf "$bundle.zip" $bundle
          if ($LASTEXITCODE) { throw 'Packaging failed' }
          $sha=(Get-FileHash "$bundle.zip").Hash.ToLowerInvariant()
          "$sha  $bundle.zip" | Set-Content -Encoding ascii SHA256SUMS.txt
      - name: Publish download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create toolbox-desktop-20261127 Studyroom-Windows-x64.zip SHA256SUMS.txt --target "$env:GITHUB_SHA" --title "松间 · Windows x64 便携版" --notes "完整解压后运行 Studyroom.exe。会议使用同一套公网配对服务，安装包附有 SHA-256 校验值。"
