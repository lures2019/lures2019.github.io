<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; form-action 'none'; base-uri 'none'">
  <title>每日待办 · Zaydenの树屋</title>
  <link rel="icon" href="../img/favicon.png">
  <link rel="stylesheet" href="../assets/personal/personal.css">
  <script defer src="../assets/personal/todo.js"></script>
</head>
<body>
  <main class="shell">
    <header class="page-intro">
      <a class="back" href="../">← 返回树屋</a>
      <p class="eyebrow">ZAYDEN’S TREEHOUSE / 01</p>
      <h1>每日待办</h1>
      <p>把想做的事记下来，按天安排，按月和按年回看。</p>
    </header>
    <noscript><p class="panel">启用 JavaScript 后即可使用待办。</p></noscript>
    <div class="layout">
      <section class="panel editor" aria-labelledby="task-form-title">
        <h2 id="task-form-title">新建待办</h2>
        <form id="task-form">
          <label for="task-title">任务</label>
          <input id="task-title" name="title" maxlength="160" required placeholder="例如：整理本周论文笔记">
          <label for="task-date">安排日期</label>
          <input id="task-date" name="date" type="date" required>
          <label for="task-note">备注 <span class="muted">（可选）</span></label>
          <textarea id="task-note" name="note" maxlength="2000" rows="3" placeholder="补充细节或下一步"></textarea>
          <div class="actions">
            <button id="task-save" type="submit">添加待办</button>
            <button id="task-cancel" class="secondary" type="button" hidden>取消编辑</button>
          </div>
        </form>
        <p class="muted note">任务保存在当前浏览器。导出备份可以在换设备时恢复记录。</p>
        <div class="actions">
          <button id="export-tasks" class="secondary" type="button">导出备份</button>
          <button id="import-tasks" class="secondary" type="button">导入备份</button>
          <input id="backup-file" type="file" accept=".json,application/json" hidden>
        </div>
      </section>
      <section class="panel" aria-labelledby="tasks-heading">
        <div class="section-heading">
          <h2 id="tasks-heading">我的任务</h2>
          <button id="today" class="secondary compact" type="button">今天</button>
        </div>
        <div class="filters">
          <label>范围
            <select id="view">
              <option value="day">按天</option>
              <option value="month">按月</option>
              <option value="year">按年</option>
            </select>
          </label>
          <label>查看日期 <input id="focus-date" type="date" required></label>
          <label>状态
            <select id="filter">
              <option value="all">全部</option>
              <option value="open">待完成</option>
              <option value="done">已完成</option>
            </select>
          </label>
        </div>
        <p class="muted" id="task-count"></p>
        <div id="task-list"></div>
      </section>
    </div>
    <p id="todo-status" class="status" role="status" aria-live="polite"></p>
    <section class="panel review" aria-labelledby="review-title">
      <h2 id="review-title">年度回顾</h2>
      <p class="muted">每年 12 月 31 日起，打开本页时会生成当年的回顾。跨年后也可以补看，下载的 HTML 可离线打开。</p>
      <div class="actions">
        <label for="review-year">选择年份</label>
        <select id="review-year"></select>
        <button type="button" id="download-review">下载年度回顾 .html</button>
      </div>
      <div id="review-preview" class="review-preview"></div>
    </section>
  </main>
</body>
</html>
